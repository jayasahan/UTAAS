version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: utaas-postgres
    restart: always
    environment:
      POSTGRES_USER: utaas_user
      POSTGRES_PASSWORD: utaas_secure_password
      POSTGRES_DB: utaas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utaas_user -d utaas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: utaas-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: utaas_user
      DB_PASSWORD: utaas_secure_password
      DB_DATABASE: utaas_db
      JWT_SECRET: utaas_development_super_secret_jwt_key_2026
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
