name: UTAAS CI Pipeline

on:
  push:
    branches: [ main, dev, mvp ]
  pull_request:
    branches: [ main, dev, mvp ]

jobs:
  commit-lint:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Commit Message Format
        uses: wagoid/commitlint-github-action@v5
        continue-on-error: true

  backend-ci:
    name: Backend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
        continue-on-error: true

      - name: Install Backend Dependencies
        run: |
          if [ -d "backend" ]; then
            cd backend && npm ci
          fi
        shell: bash

      - name: Run Backend Lint
        run: |
          if [ -d "backend" ]; then
            cd backend && npm run lint --if-present
          fi
        shell: bash

      - name: Run Backend Unit & State Transition Tests
        run: |
          if [ -d "backend" ]; then
            cd backend && npm test --if-present
          fi
        shell: bash

  frontend-ci:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
        continue-on-error: true

      - name: Install Frontend Dependencies
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm ci
          fi
        shell: bash

      - name: Run Frontend Lint
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm run lint --if-present
          fi
        shell: bash

      - name: Run Frontend Build
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm run build --if-present
          fi
        shell: bash
